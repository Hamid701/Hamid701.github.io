<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">From question to checkable answer</title>
  <desc id="desc">Four connected steps show a maintenance question, handbook search, optional engine analysis, and a source-backed answer.</desc>
  <defs>
    <linearGradient id="flow-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10263b"/>
      <stop offset="1" stop-color="#0e5368"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#79c8d5"/>
    </marker>
  </defs>
  <rect width="1200" height="420" rx="24" fill="url(#flow-bg)"/>
  <text x="55" y="62" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="34" font-weight="700">One question, four clear steps</text>
  <text x="55" y="96" fill="#afdbe4" font-family="system-ui,Segoe UI,sans-serif" font-size="19">The evidence remains visible from search to final answer.</text>

  <g stroke="#79c8d5" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M285 247H342"/>
    <path d="M575 247H632"/>
    <path d="M865 247H922"/>
  </g>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <g transform="translate(55 155)">
      <rect width="230" height="185" rx="18" fill="#ffffff"/>
      <circle cx="40" cy="42" r="22" fill="#e5f5f8"/>
      <text x="40" y="50" text-anchor="middle" fill="#167d9a" font-size="22" font-weight="700">1</text>
      <text x="26" y="94" fill="#173247" font-size="23" font-weight="700">Ask a question</text>
      <text x="26" y="125" fill="#526979" font-size="17">Use everyday language.</text>
      <text x="26" y="151" fill="#526979" font-size="17">Name an engine when</text>
      <text x="26" y="176" fill="#526979" font-size="17">an outlook is needed.</text>
    </g>

    <g transform="translate(345 155)">
      <rect width="230" height="185" rx="18" fill="#ffffff"/>
      <circle cx="40" cy="42" r="22" fill="#e5f5f8"/>
      <text x="40" y="50" text-anchor="middle" fill="#167d9a" font-size="22" font-weight="700">2</text>
      <text x="26" y="94" fill="#173247" font-size="23" font-weight="700">Find the guidance</text>
      <text x="26" y="125" fill="#526979" font-size="17">Search selected FAA</text>
      <text x="26" y="151" fill="#526979" font-size="17">handbook pages for</text>
      <text x="26" y="176" fill="#526979" font-size="17">relevant evidence.</text>
    </g>

    <g transform="translate(635 155)">
      <rect width="230" height="185" rx="18" fill="#ffffff"/>
      <circle cx="40" cy="42" r="22" fill="#fff0d6"/>
      <text x="40" y="50" text-anchor="middle" fill="#a76514" font-size="22" font-weight="700">3</text>
      <text x="26" y="94" fill="#173247" font-size="23" font-weight="700">Add engine data</text>
      <text x="26" y="125" fill="#526979" font-size="17">Summarise sensor trends</text>
      <text x="26" y="151" fill="#526979" font-size="17">and estimate remaining</text>
      <text x="26" y="176" fill="#526979" font-size="17">life when requested.</text>
    </g>

    <g transform="translate(925 155)">
      <rect width="230" height="185" rx="18" fill="#ffffff"/>
      <circle cx="40" cy="42" r="22" fill="#e4f5ed"/>
      <text x="40" y="50" text-anchor="middle" fill="#26855f" font-size="22" font-weight="700">4</text>
      <text x="26" y="94" fill="#173247" font-size="23" font-weight="700">Return evidence</text>
      <text x="26" y="125" fill="#526979" font-size="17">Give a concise answer,</text>
      <text x="26" y="151" fill="#526979" font-size="17">source pages, and clearly</text>
      <text x="26" y="176" fill="#526979" font-size="17">labelled estimates.</text>
    </g>
  </g>
</svg>
