<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 820" role="img" aria-labelledby="title desc">
  <title id="title">Remaining-life prediction error improved by 67 percent</title>
  <desc id="desc">The degradation baseline has an average absolute error of 25.8 cycles. The final gradient-boosted model has an error of 8.4 cycles. Lower is better.</desc>
  <rect width="600" height="820" rx="28" fill="#f5f9fb"/>
  <text x="42" y="64" fill="#173247" font-family="system-ui,Segoe UI,sans-serif" font-size="34" font-weight="700">A more useful</text>
  <text x="42" y="105" fill="#173247" font-family="system-ui,Segoe UI,sans-serif" font-size="34" font-weight="700">engine-life estimate</text>
  <text x="42" y="150" fill="#597080" font-family="system-ui,Segoe UI,sans-serif" font-size="21">Average absolute prediction error</text>
  <text x="42" y="180" fill="#597080" font-family="system-ui,Segoe UI,sans-serif" font-size="21">on 100 held-out engines · lower is better</text>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="42" y="259" fill="#173247" font-size="24" font-weight="700">Original degradation baseline</text>
    <rect x="42" y="282" width="516" height="72" rx="12" fill="#d7e2e7"/>
    <rect x="42" y="282" width="450" height="72" rx="12" fill="#718795"/>
    <text x="42" y="393" fill="#173247" font-size="38" font-weight="700">25.8 cycles</text>

    <text x="42" y="476" fill="#173247" font-size="24" font-weight="700">Final gradient-boosted model</text>
    <rect x="42" y="499" width="516" height="72" rx="12" fill="#d7e2e7"/>
    <rect x="42" y="499" width="147" height="72" rx="12" fill="#167d9a"/>
    <text x="42" y="640" fill="#173247" font-size="38" font-weight="700">8.4 cycles</text>
  </g>

  <g transform="translate(345 603)">
    <rect width="213" height="92" rx="46" fill="#fff0d6" stroke="#e9a23b" stroke-width="3"/>
    <text x="106" y="42" text-anchor="middle" fill="#a76514" font-family="system-ui,Segoe UI,sans-serif" font-size="33" font-weight="700">67% lower</text>
    <text x="106" y="69" text-anchor="middle" fill="#7f5b2c" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">AVERAGE ERROR</text>
  </g>

  <text x="42" y="750" fill="#6a7f8d" font-family="system-ui,Segoe UI,sans-serif" font-size="18">NASA C-MAPSS FD001 · capped targets</text>
  <text x="42" y="780" fill="#6a7f8d" font-family="system-ui,Segoe UI,sans-serif" font-size="18">Portfolio result, not an operational guarantee</text>
</svg>
