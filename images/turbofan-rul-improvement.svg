<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Remaining-life prediction error improved by 67 percent</title>
  <desc id="desc">The degradation baseline has an average absolute error of 25.8 cycles. The final gradient-boosted model has an error of 8.4 cycles. Lower is better.</desc>
  <rect width="1200" height="560" rx="24" fill="#f5f9fb"/>
  <text x="65" y="72" fill="#173247" font-family="system-ui,Segoe UI,sans-serif" font-size="36" font-weight="700">A more useful engine-life estimate</text>
  <text x="65" y="109" fill="#597080" font-family="system-ui,Segoe UI,sans-serif" font-size="20">Average absolute prediction error on 100 held-out engines · lower is better</text>

  <g font-family="system-ui,Segoe UI,sans-serif">
    <text x="65" y="205" fill="#173247" font-size="22" font-weight="700">Original degradation baseline</text>
    <rect x="65" y="228" width="970" height="68" rx="12" fill="#d7e2e7"/>
    <rect x="65" y="228" width="850" height="68" rx="12" fill="#718795"/>
    <text x="935" y="272" fill="#173247" font-size="27" font-weight="700">25.8 cycles</text>

    <text x="65" y="364" fill="#173247" font-size="22" font-weight="700">Final gradient-boosted model</text>
    <rect x="65" y="387" width="970" height="68" rx="12" fill="#d7e2e7"/>
    <rect x="65" y="387" width="277" height="68" rx="12" fill="#167d9a"/>
    <text x="365" y="431" fill="#173247" font-size="27" font-weight="700">8.4 cycles</text>
  </g>

  <g transform="translate(875 352)">
    <circle cx="120" cy="68" r="78" fill="#fff0d6" stroke="#e9a23b" stroke-width="3"/>
    <text x="120" y="59" text-anchor="middle" fill="#a76514" font-family="system-ui,Segoe UI,sans-serif" font-size="38" font-weight="700">67%</text>
    <text x="120" y="88" text-anchor="middle" fill="#7f5b2c" font-family="system-ui,Segoe UI,sans-serif" font-size="17" font-weight="700">LOWER ERROR</text>
  </g>

  <text x="65" y="520" fill="#6a7f8d" font-family="system-ui,Segoe UI,sans-serif" font-size="17">NASA C-MAPSS FD001 · capped remaining-life targets · portfolio research result, not an operational guarantee</text>
</svg>
